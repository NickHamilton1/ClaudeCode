<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2488 1364" role="img" aria-labelledby="title desc">
  <title id="title">First Baptist Church Concord Campus Map</title>
  <desc id="desc">Arrival map for First Baptist Church Concord showing the Branchview Drive approach, Deal Street approach, parking, sanctuary entrance, and elevator access.</desc>
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#071525" flood-opacity=".34"/>
    </filter>
    <filter id="textShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#071525" flood-opacity=".76"/>
    </filter>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#10233f" stop-opacity=".97"/>
      <stop offset="1" stop-color="#24464c" stop-opacity=".94"/>
    </linearGradient>
    <marker id="routeArrow" markerWidth="16" markerHeight="16" refX="12" refY="8" orient="auto">
      <path d="M2 2 14 8 2 14 5.5 8Z" fill="#d7a642"/>
    </marker>
    <style>
      .aerial { opacity: .99; }
      .wash { fill: #071525; opacity: .11; }
      .title { font-family: Georgia, "Times New Roman", serif; font-size: 42px; font-weight: 700; fill: #fff; }
      .subtitle { font-family: "DM Sans", Arial, sans-serif; font-size: 21px; fill: #e5edf2; }
      .route {
        fill: none;
        stroke: #d7a642;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-opacity: .96;
        marker-end: url(#routeArrow);
        filter: url(#textShadow);
      }
      .walk {
        fill: none;
        stroke: #fff;
        stroke-width: 6;
        stroke-linecap: round;
        stroke-dasharray: 1 15;
        stroke-opacity: .95;
        filter: url(#textShadow);
      }
      .lot {
        fill: #10233f;
        fill-opacity: .43;
        stroke: #fff;
        stroke-width: 3;
        stroke-opacity: .9;
        filter: url(#softShadow);
      }
      .label-box { fill: #10233f; fill-opacity: .93; stroke: rgba(255,255,255,.72); stroke-width: 1.5; filter: url(#softShadow); }
      .label {
        font-family: "DM Sans", Arial, sans-serif;
        fill: #fff;
        font-weight: 800;
        font-size: 24px;
        letter-spacing: .2px;
        text-anchor: middle;
      }
      .label.small { font-size: 19px; letter-spacing: 1.2px; text-transform: uppercase; }
      .map-text {
        font-family: "DM Sans", Arial, sans-serif;
        fill: #fff;
        font-size: 23px;
        font-weight: 900;
        text-anchor: middle;
        letter-spacing: .6px;
        paint-order: stroke;
        stroke: rgba(7,21,37,.78);
        stroke-width: 6px;
        stroke-linejoin: round;
        filter: url(#textShadow);
      }
      .map-text.small { font-size: 18px; text-transform: uppercase; letter-spacing: 1.5px; }
      .pin { filter: url(#softShadow); }
      .pin circle:first-child { stroke: #fff; stroke-width: 7; }
      .gold { fill: #d7a642; }
      .teal { fill: #1aa6a5; }
      .rose { fill: #c55369; }
      .line { stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-opacity: .9; filter: url(#textShadow); }
      .legend-text { font-family: "DM Sans", Arial, sans-serif; font-size: 20px; font-weight: 800; fill: #fff; }
    </style>
  </defs>

  <image class="aerial" href="church-campus-aerial-wide-2026.png" x="0" y="0" width="2488" height="1364" preserveAspectRatio="xMidYMid slice"/>
  <rect class="wash" x="0" y="0" width="2488" height="1364"/>

  <rect x="42" y="42" width="560" height="172" rx="20" fill="url(#panel)" filter="url(#softShadow)"/>
  <text class="title" x="78" y="98">First Baptist Church</text>
  <text class="subtitle" x="80" y="140">Concord, NC Campus Map</text>
  <text class="subtitle" x="80" y="177">200 Branchview Dr SE</text>

  <path class="lot" d="M760 602 875 568 933 744 805 786 728 706Z"/>
  <path class="lot" d="M955 546 1122 503 1162 624 996 672Z"/>
  <path class="lot" d="M1116 276 1300 214 1360 330 1164 394Z"/>
  <path class="lot" d="M1266 696 1462 610 1494 716 1298 806Z"/>

  <path class="route" d="M452 770 C585 760 690 820 818 882 C930 936 1048 894 1172 820 C1255 771 1327 725 1404 688"/>
  <path class="route" d="M1428 334 C1360 356 1304 374 1244 405 C1194 430 1160 461 1124 500"/>
  <path class="walk" d="M1040 724 C1062 694 1078 668 1084 634"/>

  <g class="pin" transform="translate(452 770)">
    <circle class="gold" r="26"/>
    <circle fill="#fff" r="8"/>
  </g>
  <rect class="label-box" x="280" y="706" width="284" height="48" rx="10"/>
  <text class="label small" x="422" y="737">Branchview Entrance</text>

  <g class="pin" transform="translate(1428 334)">
    <circle class="gold" r="26"/>
    <circle fill="#fff" r="8"/>
  </g>
  <rect class="label-box" x="1454" y="300" width="214" height="48" rx="10"/>
  <text class="label small" x="1561" y="331">Deal St Entrance</text>
  <line class="line" x1="1454" y1="326" x2="1434" y2="334"/>

  <g class="pin" transform="translate(1084 634)">
    <circle class="teal" r="27"/>
    <circle fill="#fff" r="8"/>
  </g>
  <rect class="label-box" x="1098" y="628" width="326" height="50" rx="10"/>
  <text class="label small" x="1261" y="660">Sanctuary Entrance</text>
  <line class="line" x1="1098" y1="652" x2="1110" y2="640"/>

  <g class="pin" transform="translate(1040 724)">
    <circle class="rose" r="27"/>
    <circle fill="#fff" r="8"/>
  </g>
  <rect class="label-box" x="864" y="748" width="300" height="50" rx="10"/>
  <text class="label small" x="1014" y="780">Elevator Access</text>
  <line class="line" x1="1030" y1="748" x2="1040" y2="724"/>

  <text class="map-text" x="842" y="705" transform="rotate(67 842 705)">West Parking</text>
  <text class="map-text" x="1048" y="562" transform="rotate(-16 1048 562)">Guest Parking</text>
  <text class="map-text small" x="1237" y="316" transform="rotate(-18 1237 316)">Accessible Parking</text>
  <text class="map-text" x="1388" y="716" transform="rotate(-24 1388 716)">Rear Parking</text>

  <text class="map-text small" x="370" y="446" transform="rotate(72 370 446)">Branchview Dr SE</text>
  <text class="map-text small" x="1518" y="420" transform="rotate(72 1518 420)">Deal St SE</text>
  <text class="map-text small" x="1112" y="896" transform="rotate(20 1112 896)">First Baptist Dr SE</text>

  <rect x="42" y="1150" width="520" height="150" rx="18" fill="#10233f" fill-opacity=".93" filter="url(#softShadow)"/>
  <circle cx="86" cy="1196" r="14" fill="#d7a642"/>
  <text class="legend-text" x="118" y="1203">Campus entrances / driving route</text>
  <circle cx="86" cy="1240" r="14" fill="#1aa6a5"/>
  <text class="legend-text" x="118" y="1247">Sanctuary / welcome entrance</text>
  <circle cx="86" cy="1284" r="14" fill="#c55369"/>
  <text class="legend-text" x="118" y="1291">Elevator access</text>
</svg>
